
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: symbiosis
      POSTGRES_USER: symbiosis_user
      POSTGRES_PASSWORD: symbiosis_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U symbiosis_user -d symbiosis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://symbiosis_user:symbiosis_password@db:5432/symbiosis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A symbiosis_proj worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgres://symbiosis_user:symbiosis_password@db:5432/symbiosis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env

volumes:
  postgres_data:
